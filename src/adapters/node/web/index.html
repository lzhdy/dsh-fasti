<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>FasTI 观测台</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- 壁纸层与可读性遮罩（纯装饰，本地挂件目录读取；无内容时保持主题底色） -->
  <div id="wallpaper-layer" aria-hidden="true"></div>
  <div id="wallpaper-scrim" aria-hidden="true"></div>

  <!-- 启动视频层（/ui/media 本地文件；无视频时直接略过，绝不白屏） -->
  <div id="splash-root"></div>

  <!-- 主控制台外壳：启动序列完成后才显示 -->
  <div id="app" hidden>
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <b>FasTI 观测台</b>
          <span>本机记忆内核 · 只读观测</span>
        </div>
      </div>
      <div id="topbar-status" class="topbar-status"></div>
    </header>

    <div id="status-strip" class="strip" aria-label="内核运行指标"></div>

    <div id="alert-strip" class="alert-strip" hidden></div>

    <nav id="nav" aria-label="数据域导航"></nav>

    <main id="main" tabindex="-1"></main>
  </div>

  <!-- 详情抽屉（右侧滑出） -->
  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" aria-label="详情面板">
    <header class="drawer-head">
      <h2 id="drawer-title">详情</h2>
      <button id="drawer-close" class="icon-btn" type="button" aria-label="关闭详情面板"></button>
    </header>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <!-- 启动序列 / 断连恢复 等全屏覆盖层 -->
  <div id="overlay-root"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
